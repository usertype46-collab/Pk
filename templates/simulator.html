<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粉體塗裝流水線模擬器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; padding-top: 60px !important; }
        .dashboard { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .speed-ctrl button { font-size: 18px; padding: 5px 15px; margin: 0 10px; cursor: pointer; }
        .status-banner { background: #27ae60; color: white; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        .factory-map { 
            position: relative; width: 100%; max-width: 768px; 
            aspect-ratio: 768 / 1024;
            background: url('/14436.png') no-repeat center center;
            background-size: cover;
            border-radius: 10px; border: 2px solid #ccc; margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .factory-map svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .chain-track {
            stroke-dasharray: 10, 8;
            animation: moveChain 1.5s linear infinite;
            opacity: 0.85;
        }
        @keyframes moveChain {
            from { stroke-dashoffset: 18; }
            to { stroke-dashoffset: 0; }
        }

        .mini-card { 
            position: absolute; width: auto; min-width: var(--card-min-w, 50px); height: var(--card-h, 26px); 
            border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transform: translate(-50%, -50%); cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: var(--card-font-sz, 12px); 
            color: white; text-shadow: 1px 1px 2px black; font-weight: bold; 
            transition: all 0.3s; z-index: 10; padding: 0 5px; white-space: nowrap; pointer-events: auto;
        }
        
        .mini-card.shape-rect { border-radius: 0; }
        .mini-card.shape-rounded { border-radius: 6px; }
        .mini-card.shape-pill { border-radius: 50px; }
        .mini-card.shape-circle { border-radius: 50%; width: var(--card-h, 26px); min-width: var(--card-h, 26px); padding: 0; overflow: hidden; }
        .mini-card.shape-leaf { border-radius: 0 50% 50% 50%; }
        .mini-card.shape-tag { border-radius: 4px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }

        .mini-card .details { display: none; }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9990; }
        
        .mini-card.expanded {
            position: fixed !important; top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 85vw !important; max-width: 350px !important; height: auto !important; border-radius: 12px !important; padding: 20px !important;
            z-index: 9999 !important; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: default; display: flex; flex-direction: column; white-space: normal; background-color: #34495e !important;
            clip-path: none !important;
        }
        .mini-card.expanded .short-id { display: none; }
        .mini-card.expanded .details { display: block; font-size: 16px; line-height: 1.8; width: 100%; position: relative; color: white; }
        
        .close-btn { 
            position: absolute; top: -10px; right: -10px; font-size: 24px; 
            cursor: pointer; font-weight: bold; background: rgba(0,0,0,0.7);
            border-radius: 50%; width: 32px; height: 32px; text-align: center; line-height: 28px; border: 2px solid white; color: white;
        }

        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .settings-content { background: white; width: 95%; max-width: 700px; padding: 25px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }
        .settings-content label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        .settings-content input, .settings-content textarea, .settings-content select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 14px;}
        .settings-content textarea { height: 100px; }
        .node-handle-container { position: relative; width: 100%; height: 350px; background: #222; border-radius: 8px; margin-top: 10px; overflow: hidden; border: 2px solid #e74c3c; }
        .node-handle { position: absolute; width: 16px; height: 16px; background: #f1c40f; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: grab; z-index: 5; transition: 0.2s; }
        .node-handle:active { cursor: grabbing; background: #e74c3c; }
        .node-handle.selected { background: #2ecc71; border-color: #27ae60; transform: translate(-50%, -50%) scale(1.4); z-index: 15; box-shadow: 0 0 10px rgba(46, 204, 113, 0.8); }
        .settings-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
        .settings-actions button { padding: 10px 20px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }

        .lang-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; background: #34495e; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .lang-btn:hover { background: #2c3e50; }
        .settings-btn { position: fixed; top: 10px; right: 170px; z-index: 1000; background: #e67e22; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .settings-btn:hover { background: #d35400; }
    </style>
</head>
<body onclick="closeAllCards()">
    <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">⚙️ 設置 / Cài đặt</button>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">🌐 切換語言 / Ngôn ngữ</button>

    <div id="overlay"></div>
    
    <div id="settingsModal" onclick="event.stopPropagation()">
        <div class="settings-content">
            <h2 data-i18n="settings_title">⚙️ 軌道與卡片客製化設定</h2>
            
            <label data-i18n="card_shape">卡片形狀樣式:</label>
            <select id="setCardShape">
                <option value="rect" data-i18n="shape_rect">矩形 (Rectangle)</option>
                <option value="rounded" data-i18n="shape_rounded">圓角 (Rounded)</option>
                <option value="pill" data-i18n="shape_pill">膠囊 (Pill)</option>
                <option value="circle" data-i18n="shape_circle">圓形 (Circle)</option>
                <option value="leaf" data-i18n="shape_leaf">葉片 (Leaf)</option>
                <option value="tag" data-i18n="shape_tag">標籤 (Tag)</option>
            </select>

            <label data-i18n="card_width">卡片最小寬度 (px):</label>
            <input type="number" id="setCardMinW" value="50">
            <label data-i18n="card_height">卡片高度 (px):</label>
            <input type="number" id="setCardH" value="26">
            <label data-i18n="card_font">卡片字體大小 (px):</label>
            <input type="number" id="setCardFont" value="12">
            
            <hr style="margin:20px 0; border:1px solid #ecf0f1;">

            <label data-i18n="track_start_lbl">軌道起點 (0.0 ~ 1.0):</label>
            <input type="number" id="setTrackStart" step="0.01" min="0" max="1" value="0.0">
            
            <label data-i18n="track_end_lbl">軌道終點 (0.0 ~ 1.0):</label>
            <input type="number" id="setTrackEnd" step="0.01" min="0" max="1" value="1.0">
            
            <label data-i18n="track_dir_lbl">輸送方向:</label>
            <select id="setTrackDirection">
                <option value="1" data-i18n="dir_forward">順向 (Forward)</option>
                <option value="-1" data-i18n="dir_backward">逆向 (Backward)</option>
            </select>

            <label data-i18n="track_path_lbl" style="margin-top:15px;">SVG 軌道 Path 座標 (d):</label>
            <textarea id="setTrackPath"></textarea>

            <label data-i18n="visual_editor_lbl">🎯 互動式節點拉動微調區 (拖動黃色圓點可即時改變路徑)</label>
            
            <div id="fineTuneControls" style="display: flex; gap: 5px; margin-top: 10px; align-items: center; background: #ecf0f1; padding: 10px; border-radius: 6px; flex-wrap: wrap;">
                <span style="font-size: 14px; font-weight: bold;"><span data-i18n="sel_node">選取節點: </span><span id="selectedNodeLabel" style="color: #e74c3c;" data-i18n="node_none">無</span></span>
                <button onclick="fineTuneNode(0, -1)" style="padding: 5px 10px; cursor: pointer; margin-left:10px; border: 1px solid #bdc3c7; border-radius: 4px; background: white;" data-i18n="btn_up">⬆️ 上</button>
                <button onclick="fineTuneNode(0, 1)" style="padding: 5px 10px; cursor: pointer; border: 1px solid #bdc3c7; border-radius: 4px; background: white;" data-i18n="btn_down">⬇️ 下</button>
                <button onclick="fineTuneNode(-1, 0)" style="padding: 5px 10px; cursor: pointer; border: 1px solid #bdc3c7; border-radius: 4px; background: white;" data-i18n="btn_left">⬅️ 左</button>
                <button onclick="fineTuneNode(1, 0)" style="padding: 5px 10px; cursor: pointer; border: 1px solid #bdc3c7; border-radius: 4px; background: white;" data-i18n="btn_right">➡️ 右</button>
                <span style="font-size: 12px; margin-left: 10px; color: #7f8c8d;" data-i18n="fine_tune_hint">(微調 1px)</span>
            </div>

            <div class="node-handle-container" id="nodeContainer">
                <svg id="nodeSvg" viewBox="0 0 1000 1333" style="width:100%; height:100%; position:absolute; top:0; left:0; pointer-events:none;">
                    <path id="previewPath" d="" fill="none" stroke="#f1c40f" stroke-width="4" stroke-dasharray="6,6"/>
                </svg>
            </div>
            
            <div class="settings-actions">
                <button onclick="resetSettings()" style="background:#95a5a6; color:white;" data-i18n="reset_settings">重設預設值</button>
                <button onclick="saveSettings()" style="background:#27ae60; color:white;" data-i18n="save_settings">儲存並同步</button>
                <button onclick="toggleSettings()" style="background:#c0392b; color:white;" data-i18n="btn_close">關閉</button>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <h2 data-i18n="sim_title">🏭 粉體塗裝流水線模擬器</h2>
        <div class="speed-ctrl">
            <span data-i18n="speed">流水線轉速: </span><span id="current-speed" style="font-weight:bold; color:red; font-size:20px;">1100</span>
            <button onclick="changeSpeed(-100); event.stopPropagation();">-100</button>
            <button onclick="changeSpeed(100); event.stopPropagation();">+100</button>
            <br><small><span data-i18n="time_lbl">跑完全程所需時間: </span><span id="total-time" style="font-weight:bold;"></span><span data-i18n="mins"> 分鐘</span></small>
        </div>
        <div class="status-banner" id="active-banner">
            <span><span data-i18n="full_line_status">⚡ 滿線模式持續上料中: </span><span id="active-card-name" style="text-decoration:underline;">暫無</span></span>
        </div>
    </div>
    
    <div class="factory-map" id="map">
        <svg viewBox="0 0 1000 1333" preserveAspectRatio="none">
            <path id="track" d="" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="chain-track"/>
        </svg>
        <div id="card-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></div>
    </div>

    <script>
        const i18n = {
            'zh': {

                'wait_title': '📦 現場待料區', 'part_ph': '手動輸入或掃描料號', 'name_ph': '手動輸入或掃描品名',

                'unload_title': '✅ 下料與完成紀錄區', 'unload_wait': '待下料區 (模擬器跑完自動傳送至此)',
                'done_list': '歷史完成紀錄', 'btn_done': '✅ 點擊完成',
                'lang_btn': '🇻🇳 切換為越文 (Việt)', 'part_no': '料號:', 'part_name': '品名:', 'qty': '數量:', 'color': '顏色:',
                'est_time': '預估佔線時間: ', 'hrs': ' 小時 ', 'done_time': '完成時間: ', 'alert_del': '⚠️ 確定要刪除這筆資料嗎？',
                'comp_lbl': '構件', 'full_line_status': '⚡ 滿線模式持續上料中: ', 'none_loading': '暫無 (等待上料)',
                'settings_title': '⚙️ 軌道與卡片客製化設定', 'save_settings': '儲存並同步', 'reset_settings': '重設預設值',
                'card_width': '卡片最小寬度 (px):', 'card_height': '卡片高度 (px):', 'card_font': '卡片字體大小 (px):',
                'track_path_lbl': 'SVG 軌道 Path 座標 (d):', 'visual_editor_lbl': '🎯 互動式節點拉動微調區',
                'sel_node': '選取節點: ', 'node_none': '無', 'btn_up': '⬆️ 上', 'btn_down': '⬇️ 下', 'btn_left': '⬅️ 左', 'btn_right': '➡️ 右', 'fine_tune_hint': '(微調 1px)',
                'card_shape': '卡片形狀樣式:', 'shape_rect': '矩形 (Rectangle)', 'shape_rounded': '圓角 (Rounded)', 'shape_pill': '膠囊 (Pill)', 'shape_circle': '圓形 (Circle)', 'shape_leaf': '葉片 (Leaf)', 'shape_tag': '標籤 (Tag)',
                'track_start_lbl': '軌道起點 (0.0 ~ 1.0):', 'track_end_lbl': '軌道終點 (0.0 ~ 1.0):', 'track_dir_lbl': '輸送方向:', 'dir_forward': '順向 (Forward)', 'dir_backward': '逆向 (Backward)'
            },
            'vi': {
                'sim_title': '🏭 Trình mô phỏng chuyền sơn', 'speed': 'Tốc độ chuyền: ', 'time_lbl': 'Thời gian 1 vòng: ', 'mins': ' Phút',
                'wait_title': '📦 Khu vực chờ vật liệu', 'part_ph': 'Nhập / Quét mã LK', 'name_ph': 'Nhập / Quét tên LK',
                'scan_btn': '📷 Quét', 'add_btn': '➕ Thêm vào hàng chờ', 'list_wait': 'Danh sách chờ (Theo thứ tự)',
                'ali_sync': 'Khu vực đồng bộ [Chờ lên hàng_Ali]', 'btn_send_ali': '➕ Chuyển cho Ali', 'btn_del': 'Xóa',
                'ocr_title': '📸 Hệ thống chụp', 'ocr_tip': 'Căn chỉnh văn bản vào khung xanh', 'btn_pic': '📸 Chụp & Lưu', 'btn_close': 'Đóng',
                'ali_title': '🏗️ Chờ lên hàng_Ali', 'line_sync': '⬇️ [Dây chuyền] Truyền đồng bộ ⬇️',
                'lbl_hang': 'Treo:', 'lbl_empty': 'Trống:', 'lbl_space': 'Cách:', 'lbl_hook': 'Móc:',
                'btn_to_line': '🚀 Lên chuyền & Nạp liên tục', 'calcing': 'Đang tính...',
                'unload_title': '✅ Khu vực xuống hàng & Lịch sử', 'unload_wait': 'Khu vực chờ xuống hàng',
                'done_list': 'Lịch sử hoàn thành', 'btn_done': '✅ Hoàn thành',
                'lang_btn': '🇹🇼 Đổi ngôn ngữ (中文)', 'part_no': 'Mã LK:', 'part_name': 'Tên LK:', 'qty': 'SL:', 'color': 'Màu:',
                'est_time': 'TG dự kiến: ', 'hrs': ' Giờ ', 'done_time': 'Thời gian HT: ', 'alert_del': 'Xác nhận xóa dữ liệu này?',
                'comp_lbl': 'Cấu kiện', 'full_line_status': '⚡ Đang nạp hàng liên tục: ', 'none_loading': 'Chưa có',
                'settings_title': '⚙️ Cài đặt tùy chỉnh đường đi & Thẻ', 'save_settings': 'Lưu & Đồng bộ', 'reset_settings': 'Mặc định',
                'card_width': 'Chiều rộng thẻ tối thiểu (px):', 'card_height': 'Chiều cao thẻ (px):', 'card_font': 'Kích thước chữ thẻ (px):',
                'track_path_lbl': 'Tọa độ Path SVG (d):', 'visual_editor_lbl': '🎯 Khu vực kéo thả điểm mốc',
                'sel_node': 'Nút đã chọn: ', 'node_none': 'Trống', 'btn_up': '⬆️ Lên', 'btn_down': '⬇️ Xuống', 'btn_left': '⬅️ Trái', 'btn_right': '➡️ Phải', 'fine_tune_hint': '(Chỉnh 1px)',
                'card_shape': 'Kiểu dáng thẻ:', 'shape_rect': 'Chữ nhật', 'shape_rounded': 'Góc bo tròn', 'shape_pill': 'Viên nang', 'shape_circle': 'Hình tròn', 'shape_leaf': 'Hình lá', 'shape_tag': 'Thẻ (Tag)',
                'track_start_lbl': 'Điểm bắt đầu (0.0 ~ 1.0):', 'track_end_lbl': 'Điểm kết thúc (0.0 ~ 1.0):', 'track_dir_lbl': 'Hướng di chuyển:', 'dir_forward': 'Tiến (Forward)', 'dir_backward': 'Lùi (Backward)'
            }
        };
        let currentLang = localStorage.getItem('appLang') || 'zh';
        function t(key) { return i18n[currentLang][key] || key; }
        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'vi' : 'zh';
            localStorage.setItem('appLang', currentLang);
            applyLang();
            if(typeof renderDynamic === 'function') renderDynamic(); 
        }
        function applyLang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(el.tagName === 'INPUT') el.placeholder = t(key);
                else el.innerHTML = t(key);
            });
            const langBtn = document.getElementById('langBtn');
            if(langBtn) langBtn.innerHTML = t('lang_btn');
            const settingsBtn = document.getElementById('settingsBtn');
            if(settingsBtn) settingsBtn.innerHTML = '⚙️ ' + (currentLang === 'zh' ? '設置' : 'Cài đặt');

            if(selectedNodeIndex === null) {
                const lbl = document.getElementById('selectedNodeLabel');
                if(lbl) {
                    lbl.innerHTML = t('node_none');
                    lbl.setAttribute('data-i18n', 'node_none');
                }
            }
        }
        function renderField(val) {
            if (typeof val === 'string' && val.startsWith('data:image')) {
                return `<img src="${val}" style="max-height: 40px; vertical-align: middle; border-radius: 4px; border: 1px solid #ccc; margin: 2px;">`;
            }
            return val;
        }
        window.addEventListener('DOMContentLoaded', () => {
            applyLang();
            loadSettings();
            requestAnimationFrame(animateCards);
        });

        const socket = io();
        const track = document.getElementById('track');
        const overlay = document.getElementById('overlay');
        const cardContainer = document.getElementById('card-container');
        let currentSpeed = 1100;
        
        // 採用提供的最新原始節點檔案設置為預設節點
        const defaultPathD = `
            M 468 1180 L 465 370 L 99 370 L 99 76 L 940 76 L 940 175 L 580 175 L 580 255 L 946 253 L 947 341 L 580 339 L 580 436 L 909 437 L 908 558 L 657 557 L 658 403 L 948 404 L 948 1184 Z
        `.trim();

        let currentPathCoords = [];
        let selectedNodeIndex = null; 

        function parsePathToCoords(dStr) {
            const coords = [];
            const regex = /[ML]\s*([0-9.]+)\s+([0-9.]+)/g;
            let match;
            while ((match = regex.exec(dStr)) !== null) {
                coords.push({ x: parseFloat(match[1]), y: parseFloat(match[2]) });
            }
            return coords;
        }

        function coordsToPathD(coords) {
            if (coords.length === 0) return '';
            let d = `M ${coords[0].x} ${coords[0].y} `;
            for (let i = 1; i < coords.length; i++) {
                d += `L ${coords[i].x} ${coords[i].y} `;
            }
            return d + 'Z';
        }

        function loadSettings() {
            const savedW = localStorage.getItem('cardMinW') || '50';
            const savedH = localStorage.getItem('cardH') || '26';
            const savedFont = localStorage.getItem('cardFont') || '12';
            const savedShape = localStorage.getItem('cardShape') || 'rounded';

            document.documentElement.style.setProperty('--card-min-w', savedW + 'px');
            document.documentElement.style.setProperty('--card-h', savedH + 'px');
            document.documentElement.style.setProperty('--card-font-sz', savedFont + 'px');

            document.getElementById('setCardMinW').value = savedW;
            document.getElementById('setCardH').value = savedH;
            document.getElementById('setCardFont').value = savedFont;
            document.getElementById('setCardShape').value = savedShape;
        }

        function selectNode(index) {
            selectedNodeIndex = index;
            const lbl = document.getElementById('selectedNodeLabel');
            lbl.innerText = index;
            lbl.removeAttribute('data-i18n'); 

            document.querySelectorAll('.node-handle').forEach((el, i) => {
                if(i === index) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function fineTuneNode(dx, dy) {
            if (selectedNodeIndex === null) return;
            let pt = currentPathCoords[selectedNodeIndex];
            pt.x = Math.max(0, Math.min(1000, pt.x + dx));
            pt.y = Math.max(0, Math.min(1333, pt.y + dy));
            
            const container = document.getElementById('nodeContainer');
            const handles = container.querySelectorAll('.node-handle');
            if(handles[selectedNodeIndex]) {
                handles[selectedNodeIndex].style.left = (pt.x / 1000 * 100) + '%';
                handles[selectedNodeIndex].style.top = (pt.y / 1333 * 100) + '%';
            }
            
            document.getElementById('previewPath').setAttribute('d', coordsToPathD(currentPathCoords));
            document.getElementById('setTrackPath').value = coordsToPathD(currentPathCoords);
        }

        function initVisualEditor(dStr) {
            selectedNodeIndex = null;
            const lbl = document.getElementById('selectedNodeLabel');
            if(lbl) {
                lbl.innerText = t('node_none');
                lbl.setAttribute('data-i18n', 'node_none');
            }

            currentPathCoords = parsePathToCoords(dStr);
            const container = document.getElementById('nodeContainer');
            container.querySelectorAll('.node-handle').forEach(el => el.remove());

            currentPathCoords.forEach((pt, index) => {
                const handle = document.createElement('div');
                handle.className = 'node-handle';
                handle.style.left = (pt.x / 1000 * 100) + '%';
                handle.style.top = (pt.y / 1333 * 100) + '%';

                let isDragging = false;
                handle.onmousedown = (e) => {
                    isDragging = true;
                    selectNode(index); 
                    e.stopPropagation();
                };
                
                handle.ontouchstart = (e) => {
                    isDragging = true;
                    selectNode(index); 
                    e.stopPropagation();
                };

                const moveHandler = (clientX, clientY) => {
                    if (!isDragging) return;
                    const rect = container.getBoundingClientRect();
                    let nx = (clientX - rect.left) / rect.width * 1000;
                    let ny = (clientY - rect.top) / rect.height * 1333;
                    nx = Math.max(0, Math.min(1000, nx));
                    ny = Math.max(0, Math.min(1333, ny));
                    
                    currentPathCoords[index] = {x: Math.round(nx), y: Math.round(ny)};
                    handle.style.left = (nx / 1000 * 100) + '%';
                    handle.style.top = (ny / 1333 * 100) + '%';
                    
                    document.getElementById('previewPath').setAttribute('d', coordsToPathD(currentPathCoords));
                    document.getElementById('setTrackPath').value = coordsToPathD(currentPathCoords);
                };

                window.addEventListener('mousemove', e => moveHandler(e.clientX, e.clientY));
                window.addEventListener('touchmove', e => {
                    if(e.touches.length > 0) moveHandler(e.touches[0].clientX, e.touches[0].clientY);
                }, {passive: false});

                window.addEventListener('mouseup', () => { isDragging = false; });
                window.addEventListener('touchend', () => { isDragging = false; });
                
                container.appendChild(handle);
            });
            
            document.getElementById('previewPath').setAttribute('d', dStr);
            document.getElementById('setTrackPath').value = dStr;
        }

        function animateCards() {
            if (!track || track.getTotalLength() === 0) {
                requestAnimationFrame(animateCards);
                return;
            }
            
            const pathLength = track.getTotalLength();
            const speedIndex = Math.max(1.0, currentSpeed / 100.0);
            const totalTimeMs = Math.round(1320.0 / speedIndex) * 60 * 1000;
            const now = Date.now();
            const currentCardIds = new Set();
            const shapeClass = 'shape-' + (localStorage.getItem('cardShape') || 'rounded');

            let trackStart = parseFloat(sys_state_cache.track_start);
            if (isNaN(trackStart)) trackStart = 0.0;
            
            let trackEnd = parseFloat(sys_state_cache.track_end);
            if (isNaN(trackEnd)) trackEnd = 1.0;
            
            let trackDir = sys_state_cache.track_direction || '1'; 

            let span = 1.0;
            if (trackDir == '1') {
                span = trackEnd >= trackStart ? (trackEnd - trackStart) : (1.0 - trackStart + trackEnd);
            } else {
                span = trackStart >= trackEnd ? (trackStart - trackEnd) : (trackStart + 1.0 - trackEnd);
            }
            if (span === 0) span = 1.0; 

            if (sys_state_cache.cards) {
                Object.values(sys_state_cache.cards).forEach(card => {
                    if (card.status === 'on_line' && card.line_start_time) {
                        currentCardIds.add(card.id);
                        let elapsed = now - card.line_start_time;
                        let baseProgress = elapsed / totalTimeMs;
                        
                        let isFinished = false;
                        if (baseProgress >= span) {
                            isFinished = true;
                            baseProgress = span; 
                        }
                        
                        let finalRatio = 0;
                        if (trackDir == '1') {
                            finalRatio = (trackStart + baseProgress) % 1.0;
                        } else {
                            finalRatio = (trackStart - baseProgress) % 1.0;
                            if (finalRatio < 0) finalRatio += 1.0; 
                        }

                        if (isFinished) {
                            if (card.is_clone) {
                                let cardEl = document.getElementById('card_' + card.id);
                                if (cardEl) cardEl.remove();
                                return; 
                            } else {
                                finalRatio = trackEnd; 
                            }
                        }

                        let pt = track.getPointAtLength(finalRatio * pathLength);
                        let cardEl = document.getElementById('card_' + card.id);
                        
                        if (!cardEl) {
                            cardEl = document.createElement('div');
                            cardEl.id = 'card_' + card.id;
                            cardEl.className = 'mini-card ' + shapeClass;
                            cardEl.style.backgroundColor = card.colorCode || '#34495e';
                            
                            cardEl.onclick = (e) => {
                                e.stopPropagation();
                                if (cardEl.classList.contains('expanded')) {
                                    cardEl.classList.remove('expanded');
                                    document.getElementById('overlay').style.display = 'none';
                                } else {
                                    closeAllCards();
                                    cardEl.classList.add('expanded');
                                    document.getElementById('overlay').style.display = 'block';
                                }
                            };
                            
                            let shortText = card.part_name || card.part_no || 'Card';
                            if (shortText.length > 5 && !shortText.includes('<img')) {
                                shortText = shortText.substring(0, 5) + '...';
                            }
                            
                            cardEl.innerHTML = `
                                <div class="short-id">${renderField(shortText)}</div>
                                <div class="details">
                                    <div class="close-btn" onclick="closeAllCards(); event.stopPropagation();">×</div>
                                    <h3 style="margin-top:0;">${renderField(card.part_no)}</h3>
                                    <p><b>品名:</b> ${renderField(card.part_name)}</p>
                                    <p><b>機/櫃:</b> ${renderField(card.model_no) || '-'}</p>
                                    <p><b>顏色:</b> ${card.color}</p>
                                    <p><b>數量:</b> ${card.qty}</p>
                                    <p><b>掛:</b> ${card.hang} &nbsp;<b>空:</b> ${card.empty} &nbsp;<b>間隔:</b> ${card.interval} &nbsp;<b>接勾:</b> ${card.hook}</p>
                                    <button onclick="socket.emit('auto_move_to_unload', '${card.id}'); closeAllCards(); event.stopPropagation();" style="width:100%; padding:10px; background:#e74c3c; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:10px;">
                                        🚚 移至下料區
                                    </button>
                                </div>
                            `;
                            cardContainer.appendChild(cardEl);
                        }
                        
                        if (!cardEl.classList.contains('expanded')) {
                            cardEl.style.left = (pt.x / 1000 * 100) + '%';
                            cardEl.style.top = (pt.y / 1333 * 100) + '%';
                        }
                    }
                });
            }

            document.querySelectorAll('#card-container .mini-card').forEach(el => {
                let id = el.id.replace('card_', '');
                if (!currentCardIds.has(id)) {
                    el.remove();
                }
            });

            requestAnimationFrame(animateCards);
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                loadSettings();
                const currentD = document.getElementById('track').getAttribute('d') || defaultPathD;
                document.getElementById('setTrackPath').value = currentD;
                initVisualEditor(currentD);
            }
        }

        function saveSettings() {
            const w = document.getElementById('setCardMinW').value;
            const h = document.getElementById('setCardH').value;
            const font = document.getElementById('setCardFont').value;
            const shape = document.getElementById('setCardShape').value;
            
            const pathD = document.getElementById('setTrackPath').value.trim();
            const tStart = document.getElementById('setTrackStart').value;
            const tEnd = document.getElementById('setTrackEnd').value;
            const tDir = document.getElementById('setTrackDirection').value;

            localStorage.setItem('cardMinW', w);
            localStorage.setItem('cardH', h);
            localStorage.setItem('cardFont', font);
            localStorage.setItem('cardShape', shape);
            
            loadSettings(); 
            
            document.querySelectorAll('#card-container .mini-card').forEach(el => {
                if (!el.classList.contains('expanded')) {
                    el.className = 'mini-card shape-' + shape;
                }
            });

            socket.emit('update_track_path', {
                path_d: pathD,
                track_start: tStart,
                track_end: tEnd,
                track_direction: tDir
            });
            
            toggleSettings(); 
        }

        function resetSettings() {
            localStorage.removeItem('cardMinW');
            localStorage.removeItem('cardH');
            localStorage.removeItem('cardFont');
            localStorage.removeItem('cardShape');
            loadSettings();
            
            document.querySelectorAll('#card-container .mini-card').forEach(el => {
                if (!el.classList.contains('expanded')) el.className = 'mini-card shape-rounded';
            });

            document.getElementById('setTrackStart').value = 0.0;
            document.getElementById('setTrackEnd').value = 1.0;
            document.getElementById('setTrackDirection').value = '1';
            document.getElementById('setTrackPath').value = defaultPathD;
            initVisualEditor(defaultPathD);
            
            socket.emit('update_track_path', {
                path_d: defaultPathD,
                track_start: 0.0,
                track_end: 1.0,
                track_direction: '1'
            });
        }

        function closeAllCards() {
            document.querySelectorAll('.mini-card.expanded').forEach(card => {
                card.classList.remove('expanded');
            });
            const overlay = document.getElementById('overlay');
            if(overlay) overlay.style.display = 'none';
        }

        function changeSpeed(val) {
            socket.emit('change_speed', val);
        }

        let sys_state_cache = {};
        socket.on('update_state', (state) => {
            sys_state_cache = state;
            currentSpeed = state.line_speed;
            
            const speedEl = document.getElementById('current-speed');
            if(speedEl) speedEl.innerText = currentSpeed;
            
            const speedIndex = Math.max(1.0, currentSpeed / 100.0);
            const totalMins = Math.round(1320.0 / speedIndex);
            const timeEl = document.getElementById('total-time');
            if(timeEl) timeEl.innerText = totalMins;

            const trackPathStr = state.track_path || defaultPathD;
            document.getElementById('track').setAttribute('d', trackPathStr);

            if (state.track_start !== undefined) document.getElementById('setTrackStart').value = state.track_start;
            if (state.track_end !== undefined) document.getElementById('setTrackEnd').value = state.track_end;
            if (state.track_direction !== undefined) document.getElementById('setTrackDirection').value = state.track_direction;

            if (state.active_card_id && state.cards[state.active_card_id]) {
                const activeCard = state.cards[state.active_card_id];
                document.getElementById('active-card-name').innerText = activeCard.part_name || activeCard.part_no || activeCard.id;
            } else {
                document.getElementById('active-card-name').innerText = t('none_loading');
            }
        });
    </script>
</body>
</html>
