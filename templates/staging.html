<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場待料區</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        .color-WE白色 { background-color: #f8fafc; color: black; }
        .color-BK黑平光 { background-color: #1e293b; color: white; }
        .color-RD紅色 { background-color: #ef4444; color: white; }
        .color-YW1黃亮光 { background-color: #eab308; color: black; }
        /* 其他顏色可依此類推加入 */
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col pb-24">
    <div class="p-4 flex justify-between items-center bg-blue-600 text-white shadow-md">
        <h1 class="text-xl font-bold">現場待料區</h1>
        <button onclick="createCard()" class="bg-green-500 px-4 py-2 rounded font-bold shadow">+ 新增構件</button>
    </div>

    <!-- 卡片列表區 -->
    <div id="card-container" class="flex-1 p-4 overflow-y-auto space-y-4"></div>

    <!-- 底部固定區 -->
    <div class="fixed bottom-0 w-full bg-slate-800 text-white p-4 flex justify-between items-center shadow-lg">
        <span class="font-bold">⬇️ 下方站點：[待上料_阿利]</span>
        <span class="text-sm text-gray-300">卡片點擊 + 號將同步傳送至下站</span>
    </div>

    <script>
        const socket = io();
        let myCards = [];

        // 圖片預覽與轉Base64 (便於跨裝置傳送)
        function handleImage(input, imgId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(imgId).src = e.target.result;
                    document.getElementById(imgId).classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // 圖片放大功能
        function enlargeImg(img) {
            if(!img.src) return;
            const w = window.open("");
            w.document.write(`<img src="${img.src}" style="width:100%; max-width:800px; margin:auto; display:block;">`);
        }

        function createCard() {
            const id = 'card_' + Date.now();
            const cardHTML = `
                <div id="${id}" class="bg-white rounded-lg shadow-md p-4 relative border-l-8 border-gray-300">
                    <button onclick="deleteCard('${id}')" class="absolute top-2 right-2 text-red-500 font-bold p-2 bg-red-100 rounded">刪除</button>
                    
                    <div class="mb-2">
                        <label class="block text-sm font-bold mb-1">烤漆顏色</label>
                        <select id="color_${id}" onchange="changeColor('${id}')" class="w-2/3 border p-2 rounded bg-gray-50 text-black">
                            <option value="">請選擇顏色...</option>
                            <option value="WE白色">WE白色</option>
                            <option value="BK黑平光">BK黑平光</option>
                            <option value="RD紅色">RD紅色</option>
                            <option value="YW1黃亮光">YW1黃亮光</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-2">
                        <div>
                            <label class="text-sm font-bold">1. 料號(拍照)</label>
                            <input type="file" accept="image/*" capture="environment" class="text-xs mb-1 w-full" onchange="handleImage(this, 'img1_${id}')">
                            <img id="img1_${id}" class="hidden w-20 h-20 object-cover rounded cursor-pointer border" onclick="enlargeImg(this)">
                        </div>
                        <div>
                            <label class="text-sm font-bold">2. 品名(拍照)</label>
                            <input type="file" accept="image/*" capture="environment" class="text-xs mb-1 w-full" onchange="handleImage(this, 'img2_${id}')">
                            <img id="img2_${id}" class="hidden w-20 h-20 object-cover rounded cursor-pointer border" onclick="enlargeImg(this)">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-sm font-bold">3. 數量</label>
                        <input type="number" id="qty_${id}" class="border p-1 w-20 rounded" value="1">
                    </div>

                    <button onclick="sendCard('${id}')" class="w-full bg-blue-500 text-white font-bold py-3 rounded shadow hover:bg-blue-600">
                        + 傳送至【待上料_阿利】
                    </button>
                </div>
            `;
            document.getElementById('card-container').insertAdjacentHTML('beforeend', cardHTML);
        }

        function changeColor(id) {
            const select = document.getElementById(`color_${id}`);
            const card = document.getElementById(id);
            const val = select.value;
            // 重置類別並套用新顏色
            card.className = card.className.replace(/color-\S+/g, '');
            if(val) card.classList.add(`color-${val}`);
        }

        function deleteCard(id) {
            if(confirm("確定要刪除這張料卡嗎？刪除後無法復原！")) {
                document.getElementById(id).remove();
                socket.emit('delete_card', { id: id });
            }
        }

        function sendCard(id) {
            const color = document.getElementById(`color_${id}`).value;
            const qty = document.getElementById(`qty_${id}`).value;
            const img1 = document.getElementById(`img1_${id}`).src || '';
            const img2 = document.getElementById(`img2_${id}`).src || '';
            
            if(!color) { alert("請先選擇烤漆顏色！"); return; }

            const cardData = {
                id: id, color: color, qty: qty, img1: img1, img2: img2, time_created: new Date().toLocaleTimeString()
            };

            socket.emit('move_card', { card: cardData, source: 'staging_cards', target: 'loading_cards' });
            document.getElementById(id).remove(); // 傳送後從本地隱藏
        }
    </script>
</body>
</html>
