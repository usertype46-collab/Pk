<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下料區監控</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = supabase.createClient('https://cnkxsxhgdtuxknrzufhv.supabase.co', 'sb_publishable_QEoX_f9G_Gf9kaaDZpaH-g_ageY5WFK');

        function UnloadArea() {
            const [completed, setCompleted] = useState([]);
            const [cardSize, setCardSize] = useState({ width: 150, height: 100 });

            useEffect(() => {
                setCompleted([{ id: 101, time: '10:05', status: '✅ 已入庫' }, { id: 102, time: '10:12', status: '✅ 已入庫' }]);
                const fetchSettings = async () => {
                    const { data } = await supabase.from('card_settings').select('*').single();
                    if(data) setCardSize(data);
                };
                fetchSettings();
            }, []);

            return (
                <div className="max-w-4xl mx-auto">
                    <h1 className="text-3xl font-bold mb-6 text-green-700 flex items-center gap-2">
                        <span>📦</span> 下料完成區
                    </h1>
                    <div className="grid grid-cols-3 gap-6">
                        {completed.map(item => (
                            <div key={item.id} 
                                 className="bg-green-50 border border-green-200 shadow-sm rounded-lg flex flex-col items-center justify-center relative"
                                 style={{ width: `${cardSize.width}px`, height: `${cardSize.height}px` }}>
                                <div className="absolute top-2 right-2 text-xs text-gray-500">{item.time}</div>
                                <div className="font-bold text-lg text-gray-800">ID: {item.id}</div>
                                <div className="text-sm text-green-600 font-medium mt-1">{item.status}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<UnloadArea />);
    </script>
</body>
</html>
