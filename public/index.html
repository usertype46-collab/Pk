<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百富粉體塗裝自動槍參數系統 / Sistem Parameter Pelapisan Serbuk Baifu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        @keyframes flashGolden {
            0%, 100% { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
            50% { color: #FFF; text-shadow: none; }
        }
        .flash-gold { animation: flashGolden 1.2s infinite; font-weight: 900; }
        .text-alert-red { color: #ef4444 !important; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen pb-12 relative">
    
    <!-- 右上角懸浮按鈕 -->
    <div class="fixed top-4 right-4 z-40">
        <button id="btnOpenThicknessModal" class="bg-pink-700/90 hover:bg-pink-600 border border-pink-500 text-white shadow-[0_0_15px_rgba(236,72,153,0.5)] px-4 py-2 rounded-full font-bold transition flex items-center gap-2 backdrop-blur-sm">
            📊 工件膜厚紀錄
        </button>
    </div>

    <div class="max-w-6xl mx-auto p-4 mt-6 md:mt-0">
        <!-- 頂部標題與左右並列設定區 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-blue-500 flex-1">
                百富粉體塗裝參數系統<br><span class="text-lg text-gray-400">(AI 智慧版)</span>
            </h1>
            <div class="grid grid-cols-2 gap-2 w-full md:w-[450px]">
                <div class="flex items-center gap-1 bg-gray-800 p-1 rounded-lg border border-gray-700 h-10 w-full">
                    <select id="langSelect" class="bg-gray-900 text-white text-xs px-1 py-1 rounded border border-gray-600 focus:outline-none focus:ring-1 focus:ring-blue-500 font-bold cursor-pointer w-full h-full">
                        <option value="tw">🇹🇼 中文</option>
                    </select>
                    <button id="btnLangInfo" class="text-gray-400 hover:text-blue-400 transition px-1">ℹ️</button>
                </div>
                <button id="btnShowModelCode" class="bg-purple-900/50 hover:bg-purple-800 text-purple-400 border border-purple-800 text-xs px-2 py-1 rounded-lg font-bold shadow transition text-center h-10 w-full flex items-center justify-center">
                    ⚡ 模型更換自動偵測
                </button>
            </div>
        </div>

        <!-- 模式切換按鈕 -->
        <div class="flex gap-4 mb-6">
            <button id="tabQueryBtn" class="flex-1 bg-blue-900/80 border border-blue-800 py-3 rounded-lg font-bold transition">相機/手動查詢模式</button>
            <button id="tabRegisterBtn" class="flex-1 bg-gray-800 border border-gray-700 py-3 rounded-lg font-bold transition">參數建檔模式</button>
        </div>

        <!-- ================= 查詢模式區塊 ================= -->
        <div id="querySection" class="block">
             <div class="bg-gray-800 p-4 rounded-xl mb-6 shadow-lg border border-gray-700">
                <h2 class="text-xl mb-4 font-bold text-yellow-500 flex items-center gap-2">📷 構件參數查詢</h2>
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <!-- 移除 capture="environment"，支援相簿與拍照 -->
                    <input type="file" accept="image/*" id="cameraInput" class="hidden">
                    <button onclick="document.getElementById('cameraInput').click()" class="bg-green-700 hover:bg-green-600 px-6 py-4 rounded-lg font-bold shadow-lg w-full text-lg transition">
                        📸 點擊拍照 / 選擇照片裁切分析 (AI)
                    </button>
                </div>
                <div class="mt-6 pt-4 border-t border-gray-700">
                    <label class="block text-gray-400 mb-2 font-bold">🔍 或從資料庫手動選擇構件：</label>
                    <select id="itemSelect" class="w-full bg-gray-900 p-3 rounded-lg border border-gray-700 text-white font-bold">
                        <option value="">載入中...</option>
                    </select>
                </div>
            </div>
            
            <!-- 查詢結果顯示面板 -->
            <div id="resultPanel" class="hidden bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
                <h3 class="text-xl font-bold text-blue-400 mb-4 border-b border-gray-700 pb-2">📋 查詢結果</h3>
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3">
                        <img id="resultImage" class="w-full rounded-lg border border-gray-600 object-cover" src="" alt="構件照片">
                    </div>
                    <div class="w-full md:w-2/3 grid grid-cols-2 gap-4 text-lg">
                        <div class="col-span-2"><span class="text-gray-400 text-sm block">品名</span><span id="resItemName" class="font-bold text-yellow-400"></span></div>
                        <div><span class="text-gray-400 text-sm block">電壓 (kV)</span><span id="resVoltage" class="font-bold text-white"></span></div>
                        <div><span class="text-gray-400 text-sm block">電流 (uA)</span><span id="resCurrent" class="font-bold text-white"></span></div>
                        <div><span class="text-gray-400 text-sm block">出粉量 (%)</span><span id="resPowder" class="font-bold text-white"></span></div>
                        <div><span class="text-gray-400 text-sm block">霧化量 (%)</span><span id="resAtomization" class="font-bold text-white"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 建檔/編輯模式區塊 ================= -->
        <div id="registerSection" class="hidden">
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 relative">
                <h2 id="formTitle" class="text-xl mb-4 font-bold text-green-500">📝 新增構件參數清冊</h2>
                
                <form id="paramForm" class="space-y-6 text-sm">
                    <!-- 圖片與 OCR 辨識 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-400 mb-1">品名 (料號/品名)</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="item_name" required class="flex-1 bg-gray-900 p-2 rounded border border-gray-700 text-white" placeholder="可手動輸入或使用右側 AI 辨識">
                                <input type="file" id="ocr_image" accept="image/*" class="hidden">
                                <button type="button" onclick="document.getElementById('ocr_image').click()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded border border-blue-500 font-bold shadow transition flex items-center gap-1">
                                    📷 辨識
                                </button>
                            </div>
                            <p id="ocrStatus" class="text-xs text-yellow-400 mt-1 hidden">🔄 AI 正在辨識文字中，請稍候...</p>
                        </div>
                        
                        <div>
                            <label class="block text-gray-400 mb-1">照片拍攝 / 選擇圖片</label>
                            <input type="file" id="reg_image" accept="image/*" class="w-full bg-gray-900 p-1.5 rounded border border-gray-700 text-white">
                        </div>
                    </div>

                    <div id="regPreviewBox" class="hidden mt-2 bg-gray-900 p-2 rounded text-center border border-gray-700">
                        <img id="regPreviewImg" class="h-32 mx-auto rounded object-contain border border-gray-700">
                    </div>

                    <!-- 塗裝參數設定 -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-gray-400 mb-1">電壓 (kV)</label>
                            <input type="number" id="param_voltage" required class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">電流 (uA)</label>
                            <input type="number" id="param_current" required class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">出粉量 (%)</label>
                            <input type="number" id="param_powder" required class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">霧化量 (%)</label>
                            <input type="number" id="param_atomization" required class="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white">
                        </div>
                    </div>

                    <!-- 送出按鈕 -->
                    <div class="flex gap-4 mt-8 pt-4 border-t border-gray-700">
                        <button type="submit" id="submitBtn" class="flex-1 bg-blue-700 hover:bg-blue-600 py-3 rounded-lg font-bold text-lg shadow-lg transition">儲存參數至資料庫</button>
                        <button type="button" id="cancelEditBtn" class="hidden flex-none bg-gray-600 hover:bg-gray-500 px-6 py-3 rounded-lg font-bold text-lg shadow-lg transition">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 圖片裁切 Modal -->
    <div id="cropModal" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-900 border border-yellow-600 p-4 rounded-xl max-w-2xl w-full max-h-[90vh] flex flex-col items-center shadow-2xl">
            <h3 class="text-lg font-bold text-yellow-500 mb-2">✂️ 調整圖片範圍與角度</h3>
            <div class="w-full max-h-[55vh] overflow-hidden bg-black flex items-center justify-center mb-4 rounded border border-gray-800">
                <img id="cropImage" class="max-w-full max-h-[50vh] block">
            </div>
            <div class="flex flex-wrap gap-2 mb-4 justify-center">
                <button type="button" id="btnRotateLeft" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-sm font-bold border border-gray-700">↺ 左旋轉</button>
                <button type="button" id="btnRotateRight" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-sm font-bold border border-gray-700">↻ 右旋轉</button>
            </div>
            <div class="flex gap-4 w-full">
                <button type="button" id="btnConfirmCrop" class="flex-1 bg-green-700 hover:bg-green-600 py-2.5 rounded-lg font-bold text-white shadow transition">✅ 確認裁切</button>
                <button type="button" id="btnCancelCrop" class="flex-1 bg-gray-700 hover:bg-gray-600 py-2.5 rounded-lg font-bold text-white transition">✕ 取消</button>
            </div>
        </div>
    </div>

    <!-- 腳本區塊 -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        // Supabase 設定 
        const supabaseUrl = 'https://wxdrtnqizpbjfugdaglb.supabase.co';
        const supabaseKey = 'sb_publishable_qUCcWVbzo-99rP85r_RhQg_EGewmxB4';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let cropper = null;
        let cropTargetMode = null; 
        let processedRegisterImageBase64 = null; 
        
        // UI 切換邏輯
        function switchTab(tab) {
            const queryBtn = document.getElementById('tabQueryBtn');
            const regBtn = document.getElementById('tabRegisterBtn');
            
            if (tab === 'query') {
                document.getElementById('querySection').classList.remove('hidden');
                document.getElementById('registerSection').classList.add('hidden');
                queryBtn.classList.replace('bg-gray-800', 'bg-blue-900/80');
                queryBtn.classList.replace('border-gray-700', 'border-blue-800');
                regBtn.classList.replace('bg-blue-900/80', 'bg-gray-800');
                regBtn.classList.replace('border-blue-800', 'border-gray-700');
            } else {
                document.getElementById('registerSection').classList.remove('hidden');
                document.getElementById('querySection').classList.add('hidden');
                regBtn.classList.replace('bg-gray-800', 'bg-blue-900/80');
                regBtn.classList.replace('border-gray-700', 'border-blue-800');
                queryBtn.classList.replace('bg-blue-900/80', 'bg-gray-800');
                queryBtn.classList.replace('border-blue-800', 'border-gray-700');
            }
        }
        document.getElementById('tabQueryBtn').addEventListener('click', () => switchTab('query'));
        document.getElementById('tabRegisterBtn').addEventListener('click', () => switchTab('register'));

        // ================= 圖片上傳與裁切邏輯 =================
        const cameraInput = document.getElementById('cameraInput');
        const regImage = document.getElementById('reg_image');
        const ocrImage = document.getElementById('ocr_image');
        const cropModal = document.getElementById('cropModal');
        const cropImage = document.getElementById('cropImage');

        function handleImageUpload(e, targetMode) {
            const file = e.target.files[0];
            if(!file) return;
            cropTargetMode = targetMode;
            const reader = new FileReader();
            reader.onload = (event) => {
                cropImage.src = event.target.result;
                cropModal.classList.remove('hidden');
                if(cropper) cropper.destroy();
                cropper = new Cropper(cropImage, { viewMode: 1 });
                e.target.value = ''; 
            };
            reader.readAsDataURL(file);
        }

        if(cameraInput) cameraInput.addEventListener('change', (e) => handleImageUpload(e, 'query'));
        if(regImage) regImage.addEventListener('change', (e) => handleImageUpload(e, 'register'));
        if(ocrImage) ocrImage.addEventListener('change', (e) => handleImageUpload(e, 'ocr'));

        document.getElementById('btnCancelCrop').addEventListener('click', () => {
            cropModal.classList.add('hidden');
            if(cropper) cropper.destroy();
        });

        document.getElementById('btnRotateLeft').addEventListener('click', () => cropper && cropper.rotate(-90));
        document.getElementById('btnRotateRight').addEventListener('click', () => cropper && cropper.rotate(90));

        document.getElementById('btnConfirmCrop').addEventListener('click', async () => {
            if(!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
            const base64 = canvas.toDataURL('image/jpeg');
            cropModal.classList.add('hidden');
            
            if(cropTargetMode === 'register') {
                // 建檔模式：儲存圖片Base64供送出使用
                processedRegisterImageBase64 = base64;
                document.getElementById('regPreviewImg').src = base64;
                document.getElementById('regPreviewBox').classList.remove('hidden');
                
            } else if (cropTargetMode === 'ocr') {
                // OCR 辨識模式：呼叫後端 API 解析文字
                const ocrStatus = document.getElementById('ocrStatus');
                const itemNameInput = document.getElementById('item_name');
                
                ocrStatus.classList.remove('hidden');
                itemNameInput.disabled = true;

                try {
                    const response = await fetch('/api/analyze-ocr', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageBase64: base64 })
                    });
                    
                    const result = await response.json();
                    if(result.success && result.text) {
                        itemNameInput.value = result.text;
                    } else {
                        alert('辨識失敗或找不到文字，請重試。');
                    }
                } catch (error) {
                    console.error("OCR Error:", error);
                    alert('系統連線發生錯誤。');
                } finally {
                    ocrStatus.classList.add('hidden');
                    itemNameInput.disabled = false;
                }
            } else if (cropTargetMode === 'query') {
                // 查詢模式：這裡可串接您的影像相似度辨識 API，此處示範單純顯示提醒
                alert('已接收裁切影像，準備發送至 AI 分析比對...');
                // fetch('/api/analyze-image', { ... }) 
            }
            cropper.destroy();
        });

        // ================= Supabase 資料庫操作 =================
        // 1. 初始化下拉選單
        async function fetchItems() {
            const { data, error } = await supabase.from('coating_params').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("讀取資料失敗", error);
                return;
            }
            const select = document.getElementById('itemSelect');
            select.innerHTML = '<option value="">請選擇或搜尋構件...</option>';
            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.item_name;
                // 將資料暫存在 dataset 方便選取時讀取
                option.dataset.voltage = item.voltage;
                option.dataset.current = item.current;
                option.dataset.powder = item.powder;
                option.dataset.atomization = item.atomization;
                option.dataset.image_url = item.image_url;
                select.appendChild(option);
            });
        }
        
        // 下拉選單選擇事件
        document.getElementById('itemSelect').addEventListener('change', (e) => {
            const selected = e.target.options[e.target.selectedIndex];
            if(!selected.value) {
                document.getElementById('resultPanel').classList.add('hidden');
                return;
            }
            document.getElementById('resItemName').textContent = selected.textContent;
            document.getElementById('resVoltage').textContent = selected.dataset.voltage;
            document.getElementById('resCurrent').textContent = selected.dataset.current;
            document.getElementById('resPowder').textContent = selected.dataset.powder;
            document.getElementById('resAtomization').textContent = selected.dataset.atomization;
            document.getElementById('resultImage').src = selected.dataset.image_url || '';
            
            document.getElementById('resultPanel').classList.remove('hidden');
        });

        // 2. 表單送出 (新增至 Supabase)
        document.getElementById('paramForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "儲存中...";

            const payload = {
                item_name: document.getElementById('item_name').value,
                voltage: document.getElementById('param_voltage').value,
                current: document.getElementById('param_current').value,
                powder: document.getElementById('param_powder').value,
                atomization: document.getElementById('param_atomization').value,
                image_url: processedRegisterImageBase64 // 將 Base64 直接存入或替換為上傳至 Storage 的 URL
            };

            const { data, error } = await supabase.from('coating_params').insert([payload]);

            if (error) {
                console.error("寫入失敗", error);
                alert("儲存失敗：" + error.message);
            } else {
                alert("✅ 參數建檔成功！");
                document.getElementById('paramForm').reset();
                processedRegisterImageBase64 = null;
                document.getElementById('regPreviewBox').classList.add('hidden');
                fetchItems(); // 更新下拉選單
            }

            submitBtn.disabled = false;
            submitBtn.textContent = "儲存參數至資料庫";
        });

        // 初始化
        fetchItems();
    </script>
</body>
</html>
