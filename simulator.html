<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>塗裝流水線 - React+D3 編輯器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: white; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        header { background: #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #e67e22; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background: #d35400; }
        .canvas-container { flex: 1; position: relative; overflow: hidden; background: #2c3e50; }
        svg { width: 100%; height: 100%; cursor: crosshair; }
        .node { fill: #3498db; stroke: white; stroke-width: 2px; cursor: pointer; }
        .node:hover { fill: #e74c3c; r: 8; }
        .path-line { fill: none; stroke: #2ecc71; stroke-width: 4px; stroke-dasharray: 10; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -1000; } }
        .settings-panel { position: absolute; right: 0; top: 0; width: 300px; height: 100%; background: rgba(0,0,0,0.8); padding: 20px; box-sizing: border-box; transform: translateX(100%); transition: 0.3s; }
        .settings-panel.open { transform: translateX(0); }
        input[type="number"] { width: 100%; padding: 8px; margin-bottom: 15px; background: #333; border: 1px solid #555; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 初始化 Supabase
        const supabaseUrl = 'https://cnkxsxhgdtuxknrzufhv.supabase.co';
        const supabaseKey = 'sb_publishable_QEoX_f9G_Gf9kaaDZpaH-g_ageY5WFK';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function Simulator() {
            const [isEditMode, setIsEditMode] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [cardStyle, setCardStyle] = useState({ width: 40, height: 20 });
            const [activeCards, setActiveCards] = useState({});
            
            // 初始軌道座標 (你可以在編輯模式中拖拉這些點來達到要求的偏移)
            const [points, setPoints] = useState([
                { id: 1, x: 100, y: 400, label: '上料區' },
                { id: 2, x: 300, y: 400, label: '噴房' },
                { id: 3, x: 300, y: 150, label: '噴房轉角' }, // 往上拉至烘烤爐中央
                { id: 4, x: 700, y: 150, label: '烘烤爐' },
                { id: 5, x: 700, y: 400, label: '下料區' }
            ]);

            const svgRef = useRef();
            const pathRef = useRef();
            const workerRef = useRef();
            const socketRef = useRef();

            // 初始化 SocketIO 與 Web Worker
            useEffect(() => {
                socketRef.current = io('http://localhost:5000');
                
                socketRef.current.on('state_update', (state) => {
                    if (workerRef.current) {
                        workerRef.current.postMessage({ type: 'UPDATE_CARDS', cards: state.cards });
                    }
                });

                // 啟動 Web Worker 模擬引擎
                workerRef.current = new Worker('worker.js');
                workerRef.current.onmessage = (e) => {
                    if (e.data.type === 'TICK') {
                        setActiveCards(e.data.cards);
                    }
                };

                return () => {
                    socketRef.current.disconnect();
                    workerRef.current.terminate();
                };
            }, []);

            // D3 拖拉邏輯整合
            useEffect(() => {
                if (!svgRef.current || !isEditMode) return;

                const drag = d3.drag()
                    .on('drag', (event, d) => {
                        setPoints(prev => prev.map(p => {
                            if (p.id === d.id) {
                                return { ...p, x: event.x, y: event.y };
                            }
                            return p;
                        }));
                    });

                d3.select(svgRef.current)
                  .selectAll('.node')
                  .data(points)
                  .call(drag);
                  
            }, [points, isEditMode]);

            // 繪製路徑
            const lineGenerator = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveMonotoneX);
            const pathData = lineGenerator(points);

            // 取得卡片在 SVG 路徑上的精確位置
            const getPointAtProgress = (progress) => {
                if (!pathRef.current) return { x: 0, y: 0 };
                const length = pathRef.current.getTotalLength();
                if (length === 0) return { x: 0, y: 0 };
                return pathRef.current.getPointAtLength(length * progress);
            };

            const saveToSupabase = async () => {
                const { data, error } = await supabase
                    .from('line_configs')
                    .upsert([{ id: 1, points_data: points, card_style: cardStyle }]);
                if(!error) alert('設定已儲存至 Supabase!');
            };

            return (
                <div id="app">
                    <header>
                        <h2>🏭 粉體塗裝流水線模擬引擎</h2>
                        <div>
                            <button onClick={() => setIsEditMode(!isEditMode)} style={{marginRight: '10px'}}>
                                {isEditMode ? '💾 鎖定軌道' : '✏️ 編輯軌道座標'}
                            </button>
                            <button onClick={() => setSettingsOpen(!settingsOpen)}>
                                ⚙️ 客製化設置
                            </button>
                        </div>
                    </header>

                    <div className="canvas-container">
                        <svg ref={svgRef}>
                            {/* 軌道路線 */}
                            <path ref={pathRef} d={pathData} className="path-line" />
                            
                            {/* 節點 (僅在編輯模式下顯示並可拖拉) */}
                            {isEditMode && points.map((p) => (
                                <g key={p.id} transform={`translate(${p.x},${p.y})`}>
                                    <circle className="node" r="6" />
                                    <text y="-10" fill="white" fontSize="12" textAnchor="middle">{p.label}</text>
                                    <text y="15" fill="#aaa" fontSize="10" textAnchor="middle">{`(${Math.round(p.x)}, ${Math.round(p.y)})`}</text>
                                </g>
                            ))}

                            {/* 物料卡片動態渲染 */}
                            {Object.values(activeCards).map(card => {
                                const pos = getPointAtProgress(card.progress);
                                return (
                                    <rect 
                                        key={card.id}
                                        x={pos.x - cardStyle.width/2}
                                        y={pos.y - cardStyle.height/2}
                                        width={cardStyle.width}
                                        height={cardStyle.height}
                                        fill="orange"
                                        rx="4"
                                    />
                                );
                            })}
                        </svg>

                        {/* 右側設定面板 */}
                        <div className={`settings-panel ${settingsOpen ? 'open' : ''}`}>
                            <h3>卡片樣式設定</h3>
                            <label>寬度 (Width):</label>
                            <input type="number" value={cardStyle.width} onChange={e => setCardStyle({...cardStyle, width: Number(e.target.value)})} />
                            
                            <label>長度 (Height):</label>
                            <input type="number" value={cardStyle.height} onChange={e => setCardStyle({...cardStyle, height: Number(e.target.value)})} />
                            
                            <button onClick={saveToSupabase} style={{width: '100%', marginTop: '20px', background: '#2ecc71'}}>
                                同步至雲端資料庫
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Simulator />);
    </script>
</body>
</html>
